AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OpsFusion operator API boundary.

Parameters:
  EnvironmentName: {Type: String}
  DeploymentContractVersion: {Type: String}
  ReleaseId: {Type: String, Default: local}
  HarnessArn: {Type: String, Default: ''}
  GatewayArn: {Type: String, Default: ''}
  MemoryArn: {Type: String, Default: ''}
  RegistryId: {Type: String, Default: ''}

Resources:
  OpsFusionUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub opsfusion-${EnvironmentName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        Environment: !Ref EnvironmentName
        Purpose: opsfusion-console

  OpsFusionAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: opsfusion-admin
      Description: May invite users and access the read-only OpsFusion analysis console.
      UserPoolId: !Ref OpsFusionUserPool
      Precedence: 1

  OpsFusionUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OpsFusionUserPool
      ClientName: !Sub opsfusion-${EnvironmentName}-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  ApplicationApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub opsfusion-${EnvironmentName}-api
      CodeUri: ../../..
      Handler: apps.api.app.handler
      Runtime: python3.12
      Timeout: 300
      FunctionUrlConfig:
        AuthType: NONE
        Cors: {AllowOrigins: ['*'], AllowMethods: [GET, POST], AllowHeaders: ['content-type', 'authorization']}
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Sub 'opsfusion-${EnvironmentName}-workflow'
        - DynamoDBWritePolicy:
            TableName: !Sub 'opsfusion-${EnvironmentName}-workflow'
        - DynamoDBReadPolicy:
            TableName: !Sub 'opsfusion-${EnvironmentName}-evidence'
        - DynamoDBWritePolicy:
            TableName: !Sub 'opsfusion-${EnvironmentName}-evidence'
        - Statement:
            - Effect: Allow
              Action:
                - agent-registry:ListRegistryRecords
                - agent-registry:GetRegistryRecord
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-agentcore:InvokeHarness
                - bedrock-agentcore:InvokeAgentRuntime
              Resource: '*'
        - Statement:
            - Sid: CognitoUserAuthentication
              Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
              Resource: '*'
        - Statement:
            - Sid: CognitoAdminUserManagement
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
              Resource: !GetAtt OpsFusionUserPool.Arn
      Environment:
        Variables:
          OPSFUSION_ENVIRONMENT: !Ref EnvironmentName
          OPSFUSION_AUTH_REQUIRED: 'true'
          OPSFUSION_SERVE_WEB: 'true'
          OPSFUSION_CORS_ORIGINS: '*'
          OPSFUSION_COGNITO_USER_POOL_ID: !Ref OpsFusionUserPool
          OPSFUSION_COGNITO_CLIENT_ID: !Ref OpsFusionUserPoolClient
          OPSFUSION_COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${OpsFusionUserPool}
          OPSFUSION_ADMIN_GROUP: opsfusion-admin
          OPSFUSION_HARNESS_ARN: !Ref HarnessArn
          OPSFUSION_GATEWAY_ARN: !Ref GatewayArn
          OPSFUSION_MEMORY_ARN: !Ref MemoryArn
          OPSFUSION_REGISTRY_ID: !Ref RegistryId
          OPSFUSION_STATE_TABLE: !Sub opsfusion-${EnvironmentName}-workflow
          OPSFUSION_EVIDENCE_TABLE: !Sub opsfusion-${EnvironmentName}-evidence
          OPSFUSION_USE_DYNAMODB: 'true'

Outputs:
  EnvironmentName: {Value: !Ref EnvironmentName}
  DeploymentContractVersion: {Value: !Ref DeploymentContractVersion}
  ApplicationFunctionArn: {Value: !GetAtt ApplicationApi.Arn}
  ApplicationFunctionUrl: {Value: !GetAtt ApplicationApiUrl.FunctionUrl}
  CognitoUserPoolId: {Value: !Ref OpsFusionUserPool}
  CognitoUserPoolClientId: {Value: !Ref OpsFusionUserPoolClient}
  CognitoAdminGroup: {Value: opsfusion-admin}
